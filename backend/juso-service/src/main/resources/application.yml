server:
  port: 9204

spring:
  application:
    name: juso-service
  datasource:
    # allowLocalInfile: LOAD DATA LOCAL INFILE 허용 (클라이언트가 파일을 읽어 전송)
    url: ${JUSO_DB_URL:jdbc:mariadb://localhost:9000/juso?allowLocalInfile=true}
    # 계정/비밀번호는 코드에 두지 않는다. 루트의 .env 에 적고 scripts/run-backend.sh 로 실행하면 환경변수로 들어온다.
    username: ${JUSO_DB_USER}
    password: ${JUSO_DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # 스키마는 docker/mariadb/initdb/01-schema.sql 이 관리
    properties:
      hibernate:
        jdbc.batch_size: 1000
        order_inserts: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    jdbc-type-for-null: VARCHAR   # 빈 값(null)을 그대로 바인딩

juso:
  # 적재할 원본 파일. 업로드 없이 서버가 이 파일을 직접 읽는다.
  # 기본값은 bootRun 작업 디렉토리(backend/juso-service) 기준 상대 경로.
  data-file: ${JUSO_DATA_FILE:../../generate-data/result/202610_juso.txt}
  # 같은 파일을 DB 컨테이너 안에서 본 경로(docker/mariadb 의 /import 마운트).
  server-data-file: /import/202610_juso.txt
