server:
  port: 9203

spring:
  application:
    name: gateway
  cloud:
    gateway:
      httpclient:
        websocket:
          # 기본 64KB 를 넘는 메시지(캐치마인드에서 늦게 들어온 사람에게 보내는 그림 스냅샷)도 중계한다.
          max-frame-payload-length: 1048576
      routes:
        # /api/juso/** 요청을 juso-service(9204)로 전달
        - id: juso-service
          uri: http://localhost:9204
          predicates:
            - Path=/api/juso/**
        # /api/image/** 요청을 image-service(9205)로 전달
        - id: image-service
          uri: http://localhost:9205
          predicates:
            - Path=/api/image/**
        # /api/rag/** 요청을 rag-service(9207)로 전달
        - id: rag-service
          uri: http://localhost:9207
          predicates:
            - Path=/api/rag/**
        # 범용 테스트 결과 API (현재는 juso-service가 제공)
        - id: test-results
          uri: http://localhost:9204
          predicates:
            - Path=/api/test-results/**
        # STOMP 웹소켓(적재 진행 알림). ws:// 로 지정하면 gateway 가 업그레이드 요청을 그대로 중계한다.
        - id: juso-ws
          uri: ws://localhost:9204
          predicates:
            - Path=/ws-juso/**
        # 이미지 캐시 실험 진행 알림(STOMP)
        - id: image-ws
          uri: ws://localhost:9205
          predicates:
            - Path=/ws-image/**
        # RAG 모델 준비·검색 평가 진행 알림(STOMP)
        - id: rag-ws
          uri: ws://localhost:9207
          predicates:
            - Path=/ws-rag/**
        # 캐치마인드 STOMP 웹소켓
        - id: catch-ws
          uri: ws://localhost:9206
          predicates:
            - Path=/ws-catch/**
