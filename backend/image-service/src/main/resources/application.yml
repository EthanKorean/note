server:
  port: 9205

spring:
  application:
    name: image-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:9001}
      password: ${REDIS_PASSWORD}
  datasource:
    # 결과는 juso-service 와 같은 test_result 테이블에 남긴다(화면이 /api/test-results 로 읽는다).
    url: ${JUSO_DB_URL}
    username: ${JUSO_DB_USER}
    password: ${JUSO_DB_PASSWORD}
    hikari:
      maximum-pool-size: 4

image:
  # 생성한 상품 이미지를 두는 폴더(커밋되지 않음). 기본값은 bootRun 작업 디렉토리(backend/image-service) 기준.
  dir: ${IMAGE_DIR:../../image-data}
  # 샘플 사진 받기: {n} 이 상품 번호로 바뀐다. 같은 번호는 항상 같은 사진이 온다(무료 공개 사진 사이트).
  sample:
    url-template: ${IMAGE_SAMPLE_URL:https://picsum.photos/seed/{n}/1200/900}
    threads: ${IMAGE_SAMPLE_THREADS:8}
